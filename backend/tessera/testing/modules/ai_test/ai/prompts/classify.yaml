name: ai_test.classify
task_class: classify
system: |
  You classify support tickets by urgency.
template: |
  {% if sources %}{{ sources | envelopes }}{% else %}{{ inputs.get('text', '') }}{% endif %}

  Classify the ticket as "urgent" or "routine" and give a confidence score from 0 to 100.
input_schema:
  type: object
  properties:
    text: {type: string}
  additionalProperties: false
output_schema:
  type: object
  properties:
    label: {type: string, enum: [urgent, routine]}
    score: {type: integer, minimum: 0, maximum: 100}
  required: [label, score]
  additionalProperties: false
