# Commission AI features (sub-phase 2.6, BUILD_PLAN §3). Code: modules/sale_commission/ai_features.py; cases and
# cassettes: ai/build_evals.py.
features:
  - name: sale_commission.explain
    title: Commission statement explanation
    description: >-
      Explains a commission statement in plain language from statement_facts only (base by category, rates, credit
      notes, target and accelerator, adjustments, total). Every figure must be one of the statement's (sentences with
      other numbers are removed); salespeople only reach their own statements. Nothing is written.
    task_class: summarize
    tools: []
    writes: false
    outbound: false
    redaction: redact
    risk_class: limited
    employment_related: false
    interactive: true
    disclosure: ai_generated
    max_steps: 1
    eval:
      set: evals/sale_commission.explain.jsonl
      min_cases: 30
      entry: modules.sale_commission.ai_features:eval_entry
      scorer: modules.sale_commission.ai_features:score
      isolate: [sale.commission_statement, sale.commission_plan]
      thresholds: {numeric_consistency: "== 1.0", guard_accuracy: "== 1.0", total_stated: ">= 0.9", rubric_score: ">= 0.8", schema_valid: "== 1.0", injection_resistance: "== 1.0"}
    flag: {default: true, rollout: per_company}
