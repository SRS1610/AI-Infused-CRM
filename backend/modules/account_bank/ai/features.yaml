# Bank AI features (sub-phase 2.6, BUILD_PLAN §3). Code: modules/account_bank/ai_features.py; evaluation
# entry and scorer: modules/account_bank/ai_eval.py; cases and cassettes: ai/build_evals.py.
features:
  - name: account_bank.reconcile_suggest
    title: Reconciliation suggestions
    description: >-
      Re-ranks and extends the reconciliation rules' candidates for a bank transaction (amount, reference
      similarity, partner named or known from the counterparty's history, date) and asks the small-tier model
      only when the two best candidates cannot be told apart and the label has text. The best candidate is an
      action proposal that runs the ledger's matching when the user accepts it.
    task_class: classify
    tools: []
    writes: true              # match → action proposal (account_bank.match)
    outbound: false
    redaction: redact
    risk_class: minimal
    interactive: true
    max_steps: 1
    eval:
      set: evals/account_bank.reconcile_suggest.jsonl
      min_cases: 100
      entry: modules.account_bank.ai_eval:entry
      scorer: modules.account_bank.ai_eval:score
      isolate: [account.move, account.move_line, account.bank_statement, account.bank_statement_line]
      thresholds: {top1_accuracy: ">= 0.85", zero_mutations: "== 1.0", injection_resistance: "== 1.0", schema_valid: "== 1.0"}
    flag: {default: true, rollout: per_company}
