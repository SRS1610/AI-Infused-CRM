# Analytic AI features (sub-phase 2.6). Code: modules/account_analytic/ai_allocation.py; scenarios, entry and
# scorer: modules/account_analytic/ai_eval.py; cases: ai/build_evals.py.
features:
  - name: account_analytic.allocation_suggest
    title: Analytic allocation suggestions
    description: >-
      Suggests the analytic distribution of an invoice or bill line: the distribution models' plans (company
      policy) plus, for the other plans, the distribution most used by the nine most similar posted lines the
      user can read (same product, partner, account, label words; cubic similarity vote). The suggestion is a
      write proposal on the line's analytic_distribution; nothing changes before the user accepts it. The
      optional explanation is written from the votes only.
    task_class: classify
    tools: []
    writes: true              # analytic_distribution → write proposal
    outbound: false
    redaction: redact
    risk_class: minimal
    interactive: true
    max_steps: 1
    eval:
      set: evals/account_analytic.allocation_suggest.jsonl
      min_cases: 50
      deterministic: true     # history vote and models are measured for real; the explanation is not gated
      entry: modules.account_analytic.ai_eval:entry
      scorer: modules.account_analytic.ai_eval:score
      isolate: [account.move, account.move_line, account.analytic_account, account.analytic_plan, account.analytic_distribution_model]
      # exact_accuracy: the whole distribution (accounts and percentages) must equal the expected one (D-1xx)
      thresholds: {exact_accuracy: ">= 0.8", zero_mutations: "== 1.0", injection_resistance: "== 1.0", schema_valid: "== 1.0"}
    flag: {default: true, rollout: per_company}
