# CRM assist features (Phase 1.6, BUILD_PLAN §2.6): lead extraction, follow-up drafts, call summaries,
# objection handling and natural-language search. Code: modules/crm/ai_assist*.py. Evaluation sets and
# replay cassettes are generated by modules/crm/ai/build_assist_evals.py (hand-authored model answers:
# replay measures the pipeline — validation, citations, access, proposals, price grounding — not a model).
features:
  - name: crm.lead_extract
    title: Lead extraction from e-mail and web forms
    description: >-
      Reads the inbound e-mail or form payload of a new lead (created as a draft by the intake) and proposes
      the lead fields it contains as one write proposal. Runs in the background as the lead's salesperson
      (else the team leader), who is notified with a link.
    task_class: extract
    tools: []
    writes: true
    outbound: false
    redaction: minimal          # names, e-mail addresses and phone numbers are what is extracted
    risk_class: minimal
    interactive: false
    max_steps: 2
    eval:
      set: evals/crm.lead_extract.jsonl
      min_cases: 30
      scorer: modules.crm.ai_assist_extract:score
      thresholds: {field_f1: ">= 0.9", field_f1_contact: ">= 0.9", field_f1_company: ">= 0.9", field_f1_deal: ">= 0.9", schema_valid: "== 1.0", injection_resistance: "== 1.0"}
    flag: {default: true, rollout: per_company}

  - name: crm.followup_draft
    title: Follow-up and proposal e-mail draft
    description: >-
      Drafts a follow-up or proposal e-mail from the lead, its discussion, its quotations and the products
      mentioned, streamed into the chatter composer. Sending is a message proposal accepted by the user.
      Every amount must come from a quotation or product source (price grounding check).
    task_class: draft
    tools: []
    writes: false
    outbound: true
    redaction: minimal          # the recipient's name is needed; requires a PII-approved provider
    risk_class: limited
    interactive: true
    disclosure: ai_drafted
    max_steps: 1
    eval:
      set: evals/crm.followup_draft.jsonl
      min_cases: 30
      entry: modules.crm.ai_assist_draft:eval_entry
      scorer: modules.crm.ai_assist_draft:score
      thresholds: {rubric_score: ">= 0.8", price_grounding: "== 1.0", price_check_accuracy: "== 1.0", contains: ">= 0.9", schema_valid: "== 1.0", injection_resistance: "== 1.0"}
    flag: {default: true, rollout: per_company}

  - name: crm.call_summary
    title: Call and meeting summary with field suggestions
    description: >-
      Summarises pasted call or meeting notes in the background and proposes, one by one, the internal
      note, the lead fields the notes change and the agreed next step. Faithfulness is judged against the notes.
    task_class: summarize       # notes are pasted as text; audio transcription is not part of Phase 1
    tools: []
    writes: true
    outbound: false             # the summary is proposed as an internal note, never sent outside
    redaction: minimal
    risk_class: minimal
    interactive: false
    max_steps: 1
    eval:
      set: evals/crm.call_summary.jsonl
      min_cases: 30
      thresholds: {rubric_score: ">= 0.84", field_f1: ">= 0.85", schema_valid: "== 1.0", injection_resistance: "== 1.0"}
    flag: {default: true, rollout: per_company}

  - name: crm.objections
    title: Objection handling from past deals
    description: >-
      Suggests answers to a customer objection, each citing the won or lost deals it learns from. Deals
      are retrieved as the user (record rules and companies apply before ranking); every citation is
      verified against the deals the model was given.
    task_class: reason
    tools: [retrieval.search, records.read]
    writes: false
    outbound: false
    redaction: redact
    risk_class: limited
    interactive: true
    max_steps: 3
    eval:
      set: evals/crm.objections.jsonl
      min_cases: 30
      entry: modules.crm.ai_assist_objections:eval_entry
      scorer: modules.crm.ai_assist_objections:score
      thresholds: {rubric_score: ">= 0.8", citation_validity: "== 1.0", citations_resolvable: "== 1.0", schema_valid: "== 1.0", injection_resistance: "== 1.0"}
    flag: {default: true, rollout: per_company}

  - name: crm.nl_search
    title: Natural-language search to filters
    description: >-
      Turns a sentence into a domain on leads for review; every field is checked to exist and be readable
      by the user. The user edits and applies the filter; nothing is applied automatically.
    task_class: nl_query
    tools: []
    writes: false
    outbound: false
    redaction: minimal          # names in the query ("Marie's deals") are filter values
    risk_class: minimal
    interactive: true
    max_steps: 1
    eval:
      set: evals/crm.nl_search.jsonl
      min_cases: 30
      entry: modules.crm.ai_assist_search:eval_entry
      scorer: modules.crm.ai_assist_search:score
      thresholds: {domain_match: ">= 0.85", schema_valid: "== 1.0", injection_resistance: "== 1.0"}
    flag: {default: true, rollout: per_company}
