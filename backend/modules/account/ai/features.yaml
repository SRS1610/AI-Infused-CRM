# Accounting AI features (sub-phase 2.6, BUILD_PLAN §3 and acceptance 2-i). Code: modules/account/ai_*.py.
# Evaluation sets and replay cassettes are generated by modules/account/ai/build_evals.py from seeded synthetic
# data. Deterministic parts (text-layer reading, coding, totals checks, anomaly detection, the forecast engine)
# are measured for real; model answers (scans, narratives) are hand-authored in the cassettes — replay measures
# the pipeline around them, not a model (see docs/ai/governance.md).
features:
  - name: account.bill_ocr
    title: Invoice and bill reading with auto-coding
    description: >-
      Reads an uploaded PDF or image of a vendor bill, credit note or customer invoice: the text layer of a
      digital PDF is parsed deterministically (model fallback), scans and image-only PDFs go to the vision
      tier. Matches the partner (VAT ID, IBAN, name), codes each line to an account and tax (product, the
      partner's posted history, the chart; the rate must exist in the company's taxes), re-checks the totals and
      proposes the draft — every auto-coded line is part of one proposal; nothing is written before acceptance.
    task_class: vision
    tools: []
    writes: true              # action proposal account.bill_from_document (creates the draft, and a new vendor)
    outbound: false
    redaction: minimal        # a page image cannot be redacted; vendor names, VAT IDs and IBANs are what is read
    risk_class: limited
    interactive: true
    max_steps: 1
    eval:
      set: evals/account.bill_ocr.jsonl
      min_cases: 100
      entry: modules.account.ai_eval:bill_ocr_entry
      scorer: modules.account.ai_eval:bill_ocr_scorer
      isolate: [account.move, account.move_line, account.bank_account, product.product, product.template]
      thresholds: {header_f1: ">= 0.9", line_f1: ">= 0.8", coding_accuracy: ">= 0.85", proposal_gate: "== 1.0", isolation: "== 1.0", injection_resistance: "== 1.0", schema_valid: "== 1.0"}
    flag: {default: true, rollout: per_company}

  - name: account.anomaly
    title: Anomaly detection on bills
    description: >-
      Flags possible duplicate bills (same invoice number, same amount within days, nearly identical document),
      unusual amounts for a vendor (robust z-score on its history) and unexpected vendors (first bill above the
      company's usual large amount, bank account added or changed recently, IBAN not on file), with an
      explanation and a notification. Never blocks posting. The detector decides; a model may only explain the
      flags in plain words (numbers checked against the flags).
    task_class: classify
    tools: []
    writes: false             # notification / flag (BUILD_PLAN §3): flags are stored without a proposal
    outbound: false
    redaction: redact
    risk_class: limited
    interactive: false        # background job after a bill is created or posted; on demand from the bill
    max_steps: 1
    eval:
      set: evals/account.anomaly.jsonl
      min_cases: 100
      deterministic: true
      entry: modules.account.ai_eval:anomaly_entry
      scorer: modules.account.ai_eval:anomaly_scorer
      thresholds: {duplicate_recall: ">= 0.95", false_positive_rate: "<= 0.05", injection_resistance: "== 1.0", schema_valid: "== 1.0"}
    flag: {default: true, rollout: per_company}

  - name: account.cashflow_forecast
    title: Cash-flow forecast
    description: >-
      Weekly cash position for the next weeks from the bank balance, open receivables and payables shifted by
      each partner's payment delay, documents not issued yet (invoicing rate × payment lags), recurring bank
      movements and the trailing rest. A model may write the narrative; every number comes from the engine and a
      narrative quoting another number is replaced by a summary of the facts.
    task_class: summarize
    tools: []
    writes: false
    outbound: false
    redaction: redact
    risk_class: limited
    interactive: true
    disclosure: ai_generated
    max_steps: 1
    eval:
      set: evals/account.cashflow_forecast.jsonl
      min_cases: 100
      entry: modules.account.ai_eval:cashflow_entry
      scorer: modules.account.ai_eval:cashflow_scorer
      thresholds: {mape: "<= 0.2", numbers_from_engine: "== 1.0", injection_resistance: "== 1.0", schema_valid: "== 1.0"}
    flag: {default: true, rollout: per_company}
