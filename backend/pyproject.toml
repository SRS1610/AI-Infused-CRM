[project]
name = "tessera"
version = "0.1.0"
description = "Tessera — modular, multi-company business suite with AI built into every module (kernel and platform modules)"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.14"
authors = [{ name = "Tessera contributors" }]
dependencies = [
  # web / api
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "python-multipart>=0.0.12",
  "orjson>=3.10",
  "httpx>=0.27",
  # data
  "sqlalchemy>=2.0.35",
  "psycopg[binary,pool]>=3.2",
  "pgvector>=0.3",
  # security
  "argon2-cffi>=23.1",
  "pyotp>=2.9",
  "itsdangerous>=2.2",
  "pyjwt[crypto]>=2.9",
  "authlib>=1.3",
  "nh3>=0.2.18",
  # jobs / messaging
  "celery[redis]>=5.4",
  "redis>=5.1",
  # templating / formats
  "jinja2>=3.1",
  "pyyaml>=6.0",
  "openpyxl>=3.1",
  "segno>=1.6",
  "babel>=2.16",
  "python-dateutil>=2.9",
  "packaging>=24",
  # cli / logging
  "typer>=0.12",
  "rich>=13.8",
  "structlog>=24.4",
  "croniter>=7.0.0",
  "weasyprint>=62",
  "icalendar>=6",
  "jsonschema>=4.23",
]

[project.optional-dependencies]
pdf = ["weasyprint>=62"]
storage = ["boto3>=1.35"]

[dependency-groups]
dev = [
  # the AI gateway library, for TESSERA_AI_GATEWAY_URL=inprocess (tests, single-process setups)
  "tessera-gateway",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "pytest-xdist>=3.6",
  "hypothesis>=6.112",
  "freezegun>=1.5",
  "faker>=30",
  "respx>=0.21",
  "ruff>=0.7",
  "mypy>=1.13",
  "types-PyYAML",
  "types-python-dateutil",
  "pre-commit>=4.0",
  "zxing-cpp>=3.1.1",
  "aiosmtpd>=1.4.6",
  "radicale>=3.2",
]

[project.scripts]
tessera = "tessera.cli.main:app"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tessera", "modules"]

[tool.uv.sources]
tessera-gateway = { path = "../gateway", editable = true }

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "C4", "SIM", "RUF", "PL"]
ignore = [
  "S101",    # assert is fine in tests and invariants
  "PLR0913", # many arguments are normal for ORM field constructors
  "PLR0917", # idem, positional
  "PLR2004", # magic numbers in tests
  "RUF012",  # mutable class attributes are the ORM declaration style
  "B008",    # function call in defaults (Typer options)
  "N818",    # exception naming
  "N812",    # `from tessera.orm import fields as F` is the house style
  "PLC0415", # lazy imports keep CLI start-up fast and break import cycles between kernel layers
  "PLW0603", # module-level singletons (settings, engines, storage)
  "PLW2901", # loop variable reassignment is used deliberately for normalisation
  "UP047",   # TypeVar-based generics stay readable for decorator helpers
  "PLR0912", "PLR0915", "PLR0911", "C901",  # complexity: measured by review, not lint
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S", "PLR", "SIM117", "E501"]
"conftest.py" = ["S", "E402"]
"**/data/**" = ["S105"]
"modules/core/hooks.py" = ["S105"]
# table/column names below come from the model registry, never from requests
"modules/contacts/merge.py" = ["S608"]
"modules/crm/services.py" = ["S608"]
# generated evaluation data: long literal adversarial texts
"tessera/testing/modules/ai_test/ai/build_corpus.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
# The metadata ORM is dynamic by design (fields are descriptors composed at runtime), so the
# kernel runs mypy in checked-but-not-strict mode (D-025); strictness is tightened per package
# as the surface stabilises.
python_version = "3.12"
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_configs = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]
exclude = ["tests/", "tessera/testing/"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tessera.orm.domain", "tessera.orm.cache", "tessera.modules.graph", "tessera.modules.manifest", "tessera.exceptions", "tessera.config"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tessera", "modules"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
markers = [
  "db: test needs a PostgreSQL database (TESSERA_TEST_DATABASE_URL)",
  "slow: long-running test",
  "perf: performance assertion on seeded data",
]
filterwarnings = [
  "error::DeprecationWarning:tessera.*",
  "ignore:authlib.jose module is deprecated:DeprecationWarning",
]

[tool.coverage.run]
source = ["tessera", "modules"]
branch = true
omit = ["*/tests/*", "*/migrations/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
