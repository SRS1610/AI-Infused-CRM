[project]
name = "tessera-gateway"
version = "0.1.0"
description = "Tessera AI gateway: provider routing, budgets, redaction, validation and the usage ledger"
license = "Apache-2.0"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "anthropic>=2.7,<3",
  "openai>=3.48,<4",
  "httpx2>=2.16",
  "jsonschema>=4.23",
  "psycopg[binary,pool]>=3.2",
  "redis>=5.1",
  "cryptography>=43",
  "prometheus-client>=0.21",
  "typer>=0.12",
]

[project.scripts]
gateway = "gateway.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "ruff>=0.7",
  "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gateway"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "C4", "SIM", "RUF", "PL"]
ignore = ["S101", "PLR0913", "PLR0917", "PLR2004", "B008", "N818", "PLC0415", "PLW0603",
          "PLR0912", "PLR0915", "PLR0911", "C901"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PLR", "E501"]
# identifiers interpolated into SQL come from constants in the module, never from requests
"gateway/ledger.py" = ["S608"]
"gateway/config.py" = ["S608"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
warn_redundant_casts = true
no_implicit_optional = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
markers = ["db: needs PostgreSQL (GATEWAY_TEST_DATABASE_URL)"]

[tool.coverage.run]
source = ["gateway"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
